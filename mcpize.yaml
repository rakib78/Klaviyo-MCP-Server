name: klaviyo-mcp-server
display_name: Klaviyo Email Ops MCP
version: 1.0.0
description: >
  Control Klaviyo email marketing through Claude. Search profiles with 
  predictive CLV and churn data, manage campaigns and flows, work with 
  lists and segments, query metrics, track custom events, and preview 
  email templates — all via natural language.
short_description: >
  Klaviyo email ops for Claude — profiles, campaigns, flows, lists, 
  segments, metrics, and events via natural language.
author: Md Rakibul Islam
license: MIT
runtime: http

credentials:
  - name: KLAVIYO_API_KEY
    display_name: Klaviyo Private API Key
    description: >
      Your Klaviyo private API key. Get it from Klaviyo → Settings → API Keys → Create Private API Key.
      Required scopes: Profiles (Read/Write), Campaigns (Read), Flows (Read/Write),
      Lists (Read/Write), Segments (Read), Metrics (Read), Events (Read/Write), Templates (Read).
    required: true
    secret: true

tools:
  - klaviyo_search_profiles
  - klaviyo_get_profile
  - klaviyo_update_profile
  - klaviyo_list_campaigns
  - klaviyo_get_campaign
  - klaviyo_get_campaign_report
  - klaviyo_list_flows
  - klaviyo_get_flow
  - klaviyo_update_flow_status
  - klaviyo_get_flow_report
  - klaviyo_list_lists
  - klaviyo_get_list
  - klaviyo_create_list
  - klaviyo_add_profiles_to_list
  - klaviyo_list_segments
  - klaviyo_get_segment
  - klaviyo_list_metrics
  - klaviyo_get_metric_aggregate
  - klaviyo_get_profile_events
  - klaviyo_create_event
  - klaviyo_list_templates
  - klaviyo_get_template
